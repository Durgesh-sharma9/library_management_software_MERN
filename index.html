<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibraFlow ERP - Smart School & College Library Management Cloud</title>
    <meta name="description" content="Next-generation Multi-School Library ERP with barcode scanning, automated fine calculations, physical audit inventory, and PWA offline capability." />
    <meta property="og:title" content="LibraFlow ERP - Smart Library Cloud" />
    <meta property="og:description" content="Next-generation Multi-School Library ERP with offline-ready Progressive Web App support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Early PWA Install Prompt Listener -->
    <script>
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-deferred-prompt-ready'));
      });
    </script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
